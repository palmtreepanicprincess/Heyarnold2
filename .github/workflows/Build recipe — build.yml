name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize resource file names
        run: |
          find app/src/main/res -type f | while IFS= read -r f; do
            d=$(dirname "$f"); b=$(basename "$f")
            nb=$(printf '%s' "$b" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9._]/_/g')
            if [ "$b" != "$nb" ]; then echo "renaming: $b -> $nb"; mv -f "$f" "$d/$nb"; fi
          done
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArnoldsRoom-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
